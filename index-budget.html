<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=index.html">
    <title>Перенаправление...</title>
    <link rel="stylesheet" href="shared.css">
    <script src="auth.js"></script>
    <script src="db-sync.js"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px !important;
            background: var(--c-gray-100) !important;
        }

        .message {
            text-align: center;
            padding: 32px 36px;
            background: #fff;
            border: 1px solid var(--c-gray-200);
            border-radius: var(--radius-lg);
        }

        .message h1 {
            font-size: 17px;
            margin-bottom: 14px;
        }

        .message p {
            font-size: 12.5px;
            color: var(--c-gray-500);
            margin-top: 8px;
        }

        .spinner {
            width: 22px;
            height: 22px;
            margin: 0 auto;
            border: 2px solid var(--c-gray-200);
            border-top-color: var(--c-primary);
            border-radius: 50%;
            animation: spin 700ms linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body class="page-util">
    <div class="message">
        <h1>Перенаправление...</h1>
        <div class="spinner"></div>
        <p>Эта страница перемещена на <a href="index.html" style="color: white; font-weight: bold;">index.html</a></p>
        <p><small>Если перенаправление не произошло автоматически, нажмите на ссылку выше</small></p>
    </div>
    <script>
        window.location.href = 'index.html';
    </script>
    <script src="formulas.js"></script>
    <script src="ui-kit.js"></script>
</body>
</html>
