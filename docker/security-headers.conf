# Заголовки безопасности. Подключается include'ом в server и в каждый
# location: add_header внутри location отменяет все add_header уровнем
# выше, поэтому без повторного include в location они бы терялись.
#
# CSP: 'unsafe-inline' в script-src пока нужен — на страницах инлайн-скрипты
# и onclick-атрибуты. SheetJS и Supabase SDK — свои, из vendor/. Google Fonts —
# @import в shared.css и kb-svod.html. connect-src — только наш проект
# Supabase (SUPABASE_URL в auth.js), а не весь *.supabase.co: иначе
# внедрённый скрипт мог бы слить данные в чужой проект. При смене проекта
# поправить здесь и в vercel.json — держать их в согласии.
# wss://127.0.0.1:13579 — NCALayer на компьютере пользователя (подпись ЭЦП
# заявок, ncalayer.js), https://127.0.0.1:24680 — KAZTOKEN mobile/desktop
# (его HTTP API использует ncalayer-js-client): наружу не ведут.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://fdzwvwapcxoxllfqaoxw.supabase.co wss://fdzwvwapcxoxllfqaoxw.supabase.co wss://127.0.0.1:13579 https://127.0.0.1:24680; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
