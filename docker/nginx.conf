server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/html text/css application/javascript application/json;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # HTML отдаём без кеша, чтобы правки страниц применялись сразу
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Статика с хешируемым содержимым кешируется на неделю
    location ~* \.(css|js|json|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Ссылки вида /rb-svod → /rb-svod.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
