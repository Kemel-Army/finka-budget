<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="shared.css" />
        <script src="auth.js"></script>
        <script src="db-sync.js"></script>
        <title>Справки на передвижку по платежам</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
        <script src="shared-export.js"></script>
    </head>
    <body class="page-rb">
        <a href="index.html" class="back-link">← Вернуться на главную</a>

        <div class="info-bar" style="margin-bottom: 0">
            <div>
                Передвижка перераспределяет уже утверждённый план: снятие с
                одной статьи вводится со знаком «минус», добавление — со знаком
                «плюс». Строка «Всего» показывает итог передвижки — по
                республиканскому бюджету он обычно должен сойтись в ноль.
            </div>
        </div>

        <div id="mpRoot"></div>

        <script src="budget-rows.js"></script>
        <script src="monthly-plan-core.js"></script>
        <script>
            MonthlyPlan.init({
                storageKey: "spravka_peredvizhka",
                icon: "📄",
                title: "Справка на передвижку по платежам",
                subtitle: "НАО «РФМШ» • суммы в тенге",
                docFields: [
                    { key: "num", label: "№ справки", width: 90 },
                    { key: "date", label: "Дата", type: "date", width: 140 },
                    { key: "month", label: "Месяц передвижки", width: 130 },
                    { key: "reason", label: "Основание (приказ)", width: 220 },
                    { key: "economist", label: "Экономист", width: 200 },
                ],
                variants: [
                    {
                        key: "rb",
                        label: "Республиканский бюджет",
                        rows: BUDGET_ROWS.SPR_RB,
                    },
                    {
                        key: "pu",
                        label: "Подушевое (ПУ)",
                        rows: BUDGET_ROWS.SPR_PU,
                    },
                    {
                        key: "dt",
                        label: "Дотация (ФИНЦЕНТР)",
                        rows: BUDGET_ROWS.DT,
                    },
                ],
                sumVariant: {
                    key: "svod",
                    label: "📈 Свод ПУ + ДТ",
                    of: ["pu", "dt"],
                },
            });
        </script>
        <script src="sheet-ux.js"></script>
        <script src="shared-nav.js"></script>
        <script src="formulas.js"></script>
        <script src="ui-kit.js"></script>
    </body>
</html>
