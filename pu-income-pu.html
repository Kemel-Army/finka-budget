        <script>
            /* ─────────────────────────────────────────────────────────────
               Лист Excel «ДОХОДНАЯ ЧАСТЬ ПУ» (Бюджет ПУ 2026).
               Формулы воспроизведены построчно:
                 T = SUM(F:Q)            — строки с помесячным планом
                 T = E * S               — строки со стоимостью за год
                                           (вступ. взнос, АР)
                 E17 = E10+E11+E12       — контингент только по трём строкам
                                           с классами, взносы и АР не в счёт
                 F17..Q17, T17 = SUM     — итог по столбцу
                 строка 18 = строка 17 * 8%   — рентабельность
                 строка 19 = строка 17 - 18   — всего со скидкой
               ───────────────────────────────────────────────────────────── */
            const SHEET_KEY = "pu_income_pu";
            const PROFIT_RATE = 0.08; // рентабельность 8%
            const MONTHS = 12;

            // Порядок и признаки строк — как в Excel (строки 9..16)
            const ROW_DEFS = [
                { name: 'Филиал НАО "РФМШ" в г Алматы', cls: "Вступ взнос 7 кл", mode: "annual", inCont: false },
                { name: 'Филиал НАО "РФМШ" в г Алматы', cls: "7 классы", mode: "months", inCont: true },
                { name: 'Филиал НАО "РФМШ" в г Алматы', cls: "с 8 по 11 кл", mode: "months", inCont: true },
                { name: 'Филиал НАО "РФМШ" в г Алматы, Жанаозен — обучение', cls: "с 8 по 11 кл", mode: "months", inCont: true },
                { name: 'Филиал НАО "РФМШ" в г Алматы, Жанаозен — проживание', cls: "с 8 по 11 кл", mode: "months", inCont: false },
                { name: 'Филиал НАО "РФМШ" в г Алматы, Жанаозен — питание', cls: "с 8 по 11 кл", mode: "months", inCont: false },
                { name: 'Филиал НАО "РФМШ" в г Алматы', cls: "с 10 по 11 кл АР", mode: "annual", inCont: false },
                { name: 'Филиал НАО "РФМШ" в г Алматы', cls: "с 10 по 11 кл АР, предмет по выбору", mode: "months", inCont: false },
            ];
            const ROWS = ROW_DEFS.length;

            let currentBranch = "nao";
            let saveTimeout;

            function fmt(n) {
                return n.toLocaleString("ru-RU", {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2,
                });
            }

            function num(id) {
                const el = document.getElementById(id);
                return el ? parseFloat(el.value) || 0 : 0;
            }

            /* ── Разметка ─────────────────────────────────────────────── */
            function buildTable() {
                const tbody = document.getElementById("tableBody");
                let html = "";

                ROW_DEFS.forEach((def, i) => {
                    const r = i + 1;
                    const annual = def.mode === "annual";
                    html += '<tr data-row="' + r + '">';
                    html += '<td class="num-col">' + r + "</td>";
                    html += "<td>" + def.name + "</td>";
                    html += "<td>" + def.cls + "</td>";
                    html +=
                        '<td><input type="number" id="row-' + r +
                        '-cont" value="0" oninput="updateRow(' + r + ')"></td>';
                    for (let m = 1; m <= MONTHS; m++) {
                        // У строк «за год» помесячного плана нет
                        html += annual
                            ? '<td class="formula-cell">—</td>'
                            : '<td><input type="number" id="row-' + r + "-m" + m +
                              '" value="0" oninput="updateRow(' + r + ')"></td>';
                    }
                    html +=
                        '<td><input type="number" id="row-' + r +
                        '-pm" value="0" oninput="updateRow(' + r + ')"></td>';
                    html +=
                        '<td><input type="number" id="row-' + r +
                        '-py" value="0" oninput="updateRow(' + r + ')"></td>';
                    html +=
                        '<td class="formula-cell" id="row-' + r +
                        '-total">0,00</td>';
                    html += "</tr>";
                });

                // Итог, рентабельность, всего
                const spanCells = (prefix, cls) => {
                    let s = '<td class="formula-cell" id="' + prefix + '-cont">0</td>';
                    for (let m = 1; m <= MONTHS; m++)
                        s += '<td class="formula-cell" id="' + prefix + "-m" + m + '">0,00</td>';
                    s += '<td class="formula-cell">—</td><td class="formula-cell">—</td>';
                    s += '<td class="formula-cell" id="' + prefix + '-total">0,00</td>';
                    return s;
                };

                html +=
                    '<tr class="total-row"><td colspan="3"><strong>Итого</strong></td>' +
                    spanCells("total") + "</tr>";
                html +=
                    '<tr class="sub-row"><td colspan="3"><strong>Рентабельность 8%</strong></td>' +
                    spanCells("profit") + "</tr>";
                html +=
                    '<tr class="grand-row"><td colspan="3"><strong>ВСЕГО с учётом скидки и рентабельности</strong></td>' +
                    spanCells("net") + "</tr>";

                tbody.innerHTML = html;
            }

            /* ── Расчёт ───────────────────────────────────────────────── */
            function rowTotal(r) {
                const def = ROW_DEFS[r - 1];
                if (def.mode === "annual") {
                    // T = контингент * стоимость в год
                    return num("row-" + r + "-cont") * num("row-" + r + "-py");
                }
                let s = 0;
                for (let m = 1; m <= MONTHS; m++) s += num("row-" + r + "-m" + m);
                return s;
            }

            function updateRow(r) {
                document.getElementById("row-" + r + "-total").textContent =
                    fmt(rowTotal(r));
                updateTotals();
                scheduleAutoSave();
            }

            function updateTotals() {
                // Контингент — только строки с классами (Excel: E10+E11+E12)
                let totalCont = 0;
                ROW_DEFS.forEach((def, i) => {
                    if (def.inCont) totalCont += num("row-" + (i + 1) + "-cont");
                });

                const monthTotals = new Array(MONTHS).fill(0);
                let grand = 0;

                for (let r = 1; r <= ROWS; r++) {
                    if (ROW_DEFS[r - 1].mode !== "annual") {
                        for (let m = 1; m <= MONTHS; m++)
                            monthTotals[m - 1] += num("row-" + r + "-m" + m);
                    }
                    grand += rowTotal(r);
                }

                const put = (id, v) => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = fmt(v);
                };

                document.getElementById("total-cont").textContent = totalCont;
                document.getElementById("profit-cont").textContent = "—";
                document.getElementById("net-cont").textContent = "—";

                for (let m = 1; m <= MONTHS; m++) {
                    const t = monthTotals[m - 1];
                    put("total-m" + m, t);
                    put("profit-m" + m, t * PROFIT_RATE);
                    put("net-m" + m, t - t * PROFIT_RATE);
                }

                put("total-total", grand);
                put("profit-total", grand * PROFIT_RATE);
                put("net-total", grand - grand * PROFIT_RATE);
            }

            /* ── Сохранение ───────────────────────────────────────────── */
            function scheduleAutoSave() {
                const st = document.getElementById("saveStatus");
                st.textContent = "Сохраняю...";
                st.className = "auto-save-status saving";
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(saveData, 1000);
            }

            function saveData() {
                if (currentBranch === "consolidated") return;
                const data = { rows: {} };
                for (let r = 1; r <= ROWS; r++) {
                    const row = {
                        cont: num("row-" + r + "-cont"),
                        pm: num("row-" + r + "-pm"),
                        py: num("row-" + r + "-py"),
                    };
                    for (let m = 1; m <= MONTHS; m++)
                        row["m" + m] = num("row-" + r + "-m" + m);
                    data.rows[r] = row;
                }
                localStorage.setItem(
                    SHEET_KEY + "_" + currentBranch,
                    JSON.stringify(data),
                );
                const st = document.getElementById("saveStatus");
                st.textContent = "Сохранено";
                st.className = "auto-save-status saved";
            }

            function applyRow(r, row, readOnly) {
                const set = (suffix, v) => {
                    const el = document.getElementById("row-" + r + "-" + suffix);
                    if (!el) return;
                    el.value = v === undefined || v === null ? "" : v;
                    el.disabled = !!readOnly;
                };
                set("cont", row ? row.cont : "");
                set("pm", row ? row.pm : "");
                set("py", row ? row.py : "");
                for (let m = 1; m <= MONTHS; m++)
                    set("m" + m, row ? row["m" + m] : "");
            }

            function loadData() {
                const saved = localStorage.getItem(
                    SHEET_KEY + "_" + currentBranch,
                );
                const data = saved ? JSON.parse(saved) : { rows: {} };
                for (let r = 1; r <= ROWS; r++)
                    applyRow(r, (data.rows || {})[r], false);
                updateAllRows();
            }

            function updateAllRows() {
                for (let r = 1; r <= ROWS; r++)
                    document.getElementById("row-" + r + "-total").textContent =
                        fmt(rowTotal(r));
                updateTotals();
            }

            function switchBranch(newBranch) {
                if (
                    currentBranch !== "consolidated" &&
                    currentBranch !== newBranch
                ) {
                    saveData();
                }
                currentBranch = newBranch;
                document
                    .querySelectorAll(".branch-btn")
                    .forEach((btn) => btn.classList.remove("active"));
                if (window.event && window.event.target)
                    window.event.target.classList.add("active");
                if (currentBranch === "consolidated") loadConsolidatedData();
                else loadData();
            }

            function loadConsolidatedData() {
                const branches = ["almaty", "uralsk", "astana", "nao"];
                const acc = {};
                for (let r = 1; r <= ROWS; r++) {
                    acc[r] = { cont: 0, pm: 0, py: 0 };
                    for (let m = 1; m <= MONTHS; m++) acc[r]["m" + m] = 0;
                }

                branches.forEach((b) => {
                    const saved = localStorage.getItem(SHEET_KEY + "_" + b);
                    if (!saved) return;
                    try {
                        const data = JSON.parse(saved);
                        for (let r = 1; r <= ROWS; r++) {
                            const row = (data.rows || {})[r];
                            if (!row) continue;
                            acc[r].cont += parseFloat(row.cont) || 0;
                            // Стоимость на одного не суммируется — берём последнюю
                            if (parseFloat(row.pm)) acc[r].pm = parseFloat(row.pm);
                            if (parseFloat(row.py)) acc[r].py = parseFloat(row.py);
                            for (let m = 1; m <= MONTHS; m++)
                                acc[r]["m" + m] += parseFloat(row["m" + m]) || 0;
                        }
                    } catch (e) {
                        console.error("Ошибка чтения " + b, e);
                    }
                });

                for (let r = 1; r <= ROWS; r++) applyRow(r, acc[r], true);
                updateAllRows();
            }

            window.addEventListener("load", () => {
                buildTable();
                loadData();
            });
        </script>
        <script>
            // НЕ инициализируем редактируемые таблицы - структура уже готова
            console.log(' Таблица готова к работе');
            function addDetailToggles() {
                // Удаляем существующие детальные строки и иконки
                document.querySelectorAll('.detail-row').forEach(row => row.remove());
                document.querySelectorAll('.toggle-detail').forEach(toggle => toggle.remove());
                document.querySelectorAll('.expandable').forEach(cell => cell.classList.remove('expandable'));

                const dataRows = document.querySelectorAll('tbody tr');
                const branches = ['almaty', 'uralsk', 'astana', 'nao'];
                const branchNames = {
                    'almaty': 'Алматы',
                    'uralsk': 'Уральск',
                    'astana': 'Астана',
                    'nao': 'НАО «РФМШ»'
                };

                let processedCount = 0;

                dataRows.forEach((row, index) => {
                    const labelCell = row.querySelector('td.label-cell:nth-child(2)') || row.querySelector('td:nth-child(2)');
                    const firstInput = row.querySelector('input[data-cell]');

                    const isTotalRow = row.classList.contains('total-row') ||
                                       row.textContent.includes('Итого') ||
                                       row.textContent.includes('ИТОГО');

                    if (labelCell && firstInput && !isTotalRow) {
                        const rowNum = firstInput.dataset.row || index;

                        labelCell.classList.add('expandable');
                        const toggle = document.createElement('span');
                        toggle.className = 'toggle-detail';
                        toggle.textContent = '▶';
                        toggle.dataset.row = rowNum;

                        labelCell.insertBefore(toggle, labelCell.firstChild);

                        const detailRow = document.createElement('tr');
                        detailRow.className = 'detail-row';
                        detailRow.dataset.row = rowNum;

                        const emptyCell = document.createElement('td');
                        emptyCell.style.background = '#f8f9fa';
                        detailRow.appendChild(emptyCell);

                        const branchListCell = document.createElement('td');
                        branchListCell.className = 'detail-cell';
                        branchListCell.style.verticalAlign = 'top';

                        let branchList = '<div style="padding: 5px 0;">';
                        branches.forEach(b => {
                            branchList += `<div style="margin: 5px 0; line-height: 22px;"><strong style="color: #3498db;">${branchNames[b]}:</strong></div>`;
                        });
                        branchList += '</div>';
                        branchListCell.innerHTML = branchList;
                        detailRow.appendChild(branchListCell);

                        const inputs = row.querySelectorAll('input[data-cell]');
                        inputs.forEach(input => {
                            const yearCell = document.createElement('td');
                            yearCell.className = 'detail-cell';
                            yearCell.style.verticalAlign = 'top';
                            yearCell.style.textAlign = 'right';

                            let yearData = '<div style="padding: 5px 0;">';
                            branches.forEach(b => {
                                const cellId = input.dataset.cell;
                                const value = window.branchDetailsData && window.branchDetailsData[b] && window.branchDetailsData[b][cellId]
                                    ? parseFloat(window.branchDetailsData[b][cellId])
                                    : 0;
                                yearData += `<div style="margin: 5px 0; line-height: 22px; color: #555;">${value.toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>`;
                            });
                            yearData += '</div>';
                            yearCell.innerHTML = yearData;
                            detailRow.appendChild(yearCell);
                        });

                        row.parentNode.insertBefore(detailRow, row.nextSibling);

                        labelCell.addEventListener('click', function(e) {
                            const toggle = this.querySelector('.toggle-detail');
                            const detailRow = this.parentElement.nextElementSibling;

                            if (detailRow && detailRow.classList.contains('detail-row')) {
                                detailRow.classList.toggle('show');
                                toggle.classList.toggle('expanded');
                            }
                        });

                        processedCount++;
                    }
                });

                console.log(`✅ Добавлено ${processedCount} раскрывающихся блоков с детализацией`);
            }

            function removeDetailToggles() {
                document.querySelectorAll('.toggle-detail').forEach(el => el.remove());
                document.querySelectorAll('.detail-row').forEach(row => row.remove());
                document.querySelectorAll('.expandable').forEach(cell => {
                    cell.classList.remove('expandable');
                });
            }
        </script>
